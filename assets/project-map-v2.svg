    .foot { font-family: 'Courier New', Courier, monospace; font-size: 11px; letter-spacing: 2px; fill: #8b8b96; }
    .sigil { font-family: Georgia, serif; font-size: 26px; font-weight: 700; fill: #ff2a3d; }
    .path { fill: none; stroke: #5a0f16; stroke-width: 2; stroke-dasharray: 3 7; animation: march 1.4s linear infinite; }
    .ring { fill: none; stroke: #3a0a10; stroke-width: 1; stroke-dasharray: 2 6; transform-origin: 300px 380px; animation: spin 40s linear infinite; }
    .spin { fill: none; stroke: #ff2a3d; stroke-width: 1.2; stroke-dasharray: 14 10; stroke-opacity: 0.6; transform-origin: 300px 380px; animation: spin -18s linear infinite; }
    .dim  { animation: edge 2.8s ease-in-out infinite; }
    .pulse { animation: beat 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .packet { fill: #ff2a3d; filter: url(#glow); }
    .ember { animation: rise 6s linear infinite; }
    .halo { transform-origin: 300px 380px; animation: breathe 3.5s ease-in-out infinite; }
    @keyframes march { to { stroke-dashoffset: -40; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes edge  { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @keyframes beat  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
    @keyframes rise  { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-300px); opacity: 0; } }
  </style>

