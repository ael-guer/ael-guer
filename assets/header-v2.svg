<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Ali El-Guerch, ael-guer, 1337 header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.6" stop-color="#0d0609"/>
      <stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2a3d" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a0f16" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8a0f16" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 46px; letter-spacing: 6px; fill: #f2f2f4; }
    .sub   { font-family: 'Courier New', Courier, monospace; font-size: 15px; letter-spacing: 3px; fill: #8b8b96; }
    .red   { fill: #ff2a3d; }
    .in    { animation: fadeUp 1s ease-out both; }
    .in2   { animation: fadeUp 1s 0.5s ease-out both; }
    .in3   { animation: fadeUp 1s 0.9s ease-out both; }
    .sweep { animation: sweep 3s ease-in-out infinite; transform-box: fill-box; }
    .halo  { animation: breathe 3.5s ease-in-out infinite; transform-origin: 500px 150px; }
    .ember { animation: rise 5s linear infinite; }
    .speed { animation: speed 1.6s linear infinite; }
    .cur   { animation: blink 1s step-end infinite; }
    .shake { animation: jitter 6s steps(1, end) infinite; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sweep  { 0% { transform: translateX(-520px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(520px); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.08); } }
    @keyframes rise   { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-260px); opacity: 0; } }
    @keyframes speed  { 0% { transform: translateX(0); opacity: 0.6; } 100% { transform: translateX(-200px); opacity: 0; } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes jitter { 0%, 96%, 100% { transform: none; } 97% { transform: translateX(3px); } 98% { transform: translateX(-3px); } 99% { transform: none; } }
  </style>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <ellipse class="halo" cx="500" cy="150" rx="440" ry="130" fill="url(#halo)"/>

  <!-- speed lines from the right, manga style -->
  <g opacity="0.5">
    <rect class="speed" x="980" y="50" width="120" height="2" fill="#ff2a3d"/>
    <rect class="speed" x="1000" y="92" width="200" height="1" fill="#ff2a3d" style="animation-delay:0.4s"/>
    <rect class="speed" x="990" y="132" width="160" height="2" fill="#f2f2f4" style="animation-delay:0.9s"/>
    <rect class="speed" x="1000" y="190" width="240" height="1" fill="#ff2a3d" style="animation-delay:0.2s"/>
    <rect class="speed" x="985" y="240" width="140" height="2" fill="#ff2a3d" style="animation-delay:1.1s"/>
  </g>

  <!-- embers -->
  <circle class="ember" cx="110" cy="290" r="2" fill="#ff5566" style="animation-delay:0s"/>
  <circle class="ember" cx="240" cy="290" r="1.5" fill="#ff2a3d" style="animation-delay:1.2s"/>
  <circle class="ember" cx="380" cy="290" r="2.2" fill="#ff5566" style="animation-delay:2.4s"/>
  <circle class="ember" cx="620" cy="290" r="1.6" fill="#ff2a3d" style="animation-delay:0.6s"/>
  <circle class="ember" cx="760" cy="290" r="2" fill="#ff5566" style="animation-delay:3.1s"/>
  <circle class="ember" cx="890" cy="290" r="1.4" fill="#ff2a3d" style="animation-delay:1.8s"/>

  <rect class="sweep" x="0" y="232" width="1000" height="2" fill="url(#blade)"/>

  <g class="shake">
    <text class="title in" x="500" y="108" text-anchor="middle">ALI EL-GUERCH</text>
  </g>
  <text class="sub in2" x="500" y="146" text-anchor="middle">AEL-GUER &#183; 1337 &#183; 42 NETWORK &#183; 2026</text>
  <text class="sub in3" x="500" y="186" text-anchor="middle">
    <tspan class="red">&#9670;</tspan> C &#183; PYTHON &#183; LINUX &#183; GIT &#183; AI &#183; DESIGN &#183; VIDEO EDITING <tspan class="red">&#9670;</tspan>
  </text>
  <rect class="red cur" x="926" y="200" width="9" height="16"/>
</svg>
