<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="YOUTUBE">
  <style>
    .lbl { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 15px; letter-spacing: 2px; fill: #f2f2f4; }
    .url { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #d6d6dc; letter-spacing: 0.5px; }
    .note { font-family: 'Courier New', Courier, monospace; font-size: 11px; letter-spacing: 1px; fill: #8b8b96; }
    .box { fill: #0c0709; stroke: #ff2a3d; stroke-width: 1.6; animation: edge 2.6s ease-in-out infinite; }
    .scan { animation: scan 3s linear infinite; }
    .pulse { animation: beat 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes edge { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-40px); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(190px); opacity: 0; } }
    @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  <rect width="200" height="150" fill="#050507"/>
    <rect class="box" x="10" y="20" width="180" height="110" rx="10"/>
    <rect class="scan" x="10" y="20" width="180" height="3" fill="#ff2a3d"/>
    <circle class="pulse" cx="34" cy="52" r="6" fill="#ff2a3d"/>
    <text class="lbl" x="50" y="57">YOUTUBE</text>
    <text class="note" x="22" y="94">link coming soon</text>
</svg>
